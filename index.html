
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Card</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>


    <div class="onlinePoster">
        <h1> You're Invited! </h1>

        <img src="./image/img 1.png" alt="Presentation">

        <h2>Join Our Presentation</h2>

        <p>
            We warmly invite you to attend our presentation.
            Come and explore our ideas, learn something new,
            and enjoy the experience with us!
        </p>

        <h3>📍 Venue: Our Classroom</h3>
        <h3>🕒 Time: 10:30am</h3>
        <h3>Please Join Us On Time</h3></h3>

        <button onclick="showMessage()">Join Us!</button>

        <p id="message"></p>

        <footer>We look forward to seeing you! 💖</footer>
    </div>


    <script src="./JS/script.js"></script>

</body>
</html>
